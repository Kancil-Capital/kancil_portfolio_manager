name: Database migrations — check

# On every PR that touches the database: prove all migrations + seed apply
# cleanly to a fresh database, and show what merging would apply to production.

on:
  pull_request:
    paths:
      - "backend/supabase/**"

env:
  SUPABASE_CLI_VERSION: 2.122.0
  SUPABASE_PROJECT_REF: sepdqxndqkimiprsfipb

defaults:
  run:
    working-directory: backend

jobs:
  apply-from-scratch:
    name: Apply migrations to a fresh database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      # Starts only Postgres, applies every migration in order, then seed.sql
      - run: supabase db start

  production-dry-run:
    name: Dry run against production
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      # Lists the migrations a merge would apply; changes nothing
      - run: supabase db push --linked --dry-run
