name: Database migrations — deploy

# Applies new migrations to the production database when they land on main.
# Only migrations not yet recorded in production's migration history run.

on:
  push:
    branches: [main]
    paths:
      - "backend/supabase/migrations/**"
  workflow_dispatch:

concurrency:
  group: db-deploy
  cancel-in-progress: false

env:
  SUPABASE_CLI_VERSION: 2.122.0
  SUPABASE_PROJECT_REF: sepdqxndqkimiprsfipb

defaults:
  run:
    working-directory: backend

jobs:
  push:
    name: Push migrations to production
    runs-on: ubuntu-latest
    # Add required reviewers to this environment in GitHub settings to gate every push
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - run: supabase db push --linked
