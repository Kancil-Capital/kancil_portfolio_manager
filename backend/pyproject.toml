[project]
name = "kancil-backend"
version = "0.1.0"
description = "Kancil Capital Portfolio Manager — FastAPI backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "pydantic-settings>=2.13.1",
    "python-dotenv>=1.2.2",
    "uvicorn[standard]>=0.30",
    # Database
    "supabase>=2.0",
    # Market data
    "yfinance>=0.2",
    "pandas>=2.0",
    "numpy>=1.26",
    # ML / inference
    "xgboost>=2.0",
    "scikit-learn>=1.5",
    "joblib>=1.3",
    # Alpha Vantage (EPS cache)
    "httpx>=0.27",
    # FinBERT / NLP
    "transformers>=4.40",
    "torch>=2.0",
    "spacy>=3.7",
    "en-core-web-lg",  # spaCy model used for entity extraction (core/sentiment.py)
    # Background scheduler
    "apscheduler>=3.10",
    # Scrapers
    "beautifulsoup4>=4.12",
    "requests>=2.31",
    "python-dateutil>=2.9",
    "selenium>=4.0",
    "lxml>=5.0",
    "pyjwt[crypto]>=2.12.1",
]

[tool.uv.sources]
# spaCy models aren't on PyPI; pin the release wheel matching the spaCy 3.8 line
en-core-web-lg = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl" }

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "memray>=1.19.3",
    "pytest>=9.0.2",
    "pytest-asyncio>=0.24",
    "ruff>=0.15.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Adds backend/ to sys.path before importing project modules so it runs as a script
"scripts/*.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
